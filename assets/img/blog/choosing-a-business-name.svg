<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151a"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%"><stop offset="0" stop-color="#c9a33a" stop-opacity=".22"/><stop offset="1" stop-color="#c9a33a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <g id="ok"><circle r="13" fill="#4ade80" fill-opacity=".16"/><path d="M-6 0l4 4 8-8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="warn"><circle r="13" fill="#fbbf24" fill-opacity=".16"/><path d="M0-6v6M0 6v.5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/></g>
    <g id="no"><circle r="13" fill="#f87171" fill-opacity=".16"/><path d="M-5-5l10 10M5-5l-10 10" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Candidate A -->
  <g transform="translate(150 168)">
    <rect width="270" height="330" rx="22" fill="#1c1c22" stroke="#fff" stroke-opacity=".14"/>
    <text x="30" y="56" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1aa">CANDIDATE</text>
    <text x="30" y="98" font-size="38" font-weight="700" fill="#f4f4f5">Name A</text>
    <g font-size="19" fill="#d4d4d8">
      <text x="30" y="158">Trademark</text><use href="#no" x="232" y="152"/>
      <text x="30" y="206">Domain</text><use href="#ok" x="232" y="200"/>
      <text x="30" y="254">Pronunciation</text><use href="#ok" x="232" y="248"/>
      <text x="30" y="302">Search</text><use href="#warn" x="232" y="296"/>
    </g>
  </g>

  <!-- Candidate B: the chosen name -->
  <g transform="translate(465 132)">
    <rect width="270" height="366" rx="22" fill="#211d12" stroke="#c9a33a" stroke-width="2.5"/>
    <rect x="70" y="-18" width="130" height="36" rx="18" fill="#c9a33a"/>
    <text x="135" y="6" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#111114">CHOSEN</text>
    <text x="30" y="72" font-size="15" font-weight="600" letter-spacing="2" fill="#d6b65a">CANDIDATE</text>
    <text x="30" y="114" font-size="38" font-weight="700" fill="#ffffff">Name B</text>
    <g font-size="19" fill="#ececef">
      <text x="30" y="174">Trademark</text><use href="#ok" x="232" y="168"/>
      <text x="30" y="222">Domain</text><use href="#ok" x="232" y="216"/>
      <text x="30" y="270">Pronunciation</text><use href="#ok" x="232" y="264"/>
      <text x="30" y="318">Search</text><use href="#warn" x="232" y="312"/>
    </g>
  </g>

  <!-- Candidate C -->
  <g transform="translate(780 168)">
    <rect width="270" height="330" rx="22" fill="#1c1c22" stroke="#fff" stroke-opacity=".14"/>
    <text x="30" y="56" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1aa">CANDIDATE</text>
    <text x="30" y="98" font-size="38" font-weight="700" fill="#f4f4f5">Name C</text>
    <g font-size="19" fill="#d4d4d8">
      <text x="30" y="158">Trademark</text><use href="#warn" x="232" y="152"/>
      <text x="30" y="206">Domain</text><use href="#no" x="232" y="200"/>
      <text x="30" y="254">Pronunciation</text><use href="#ok" x="232" y="248"/>
      <text x="30" y="302">Search</text><use href="#ok" x="232" y="296"/>
    </g>
  </g>
</svg>
